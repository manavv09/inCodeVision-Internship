<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>inCodeVision — Glassmorphic Calculator</title>
  <meta name="description" content="A clean, responsive, and feature-rich glassmorphism calculator with history tracking and keyboard support.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Decorative Blurs -->
  <div class="blur-glow-1"></div>
  <div class="blur-glow-2"></div>

  <!-- Main Layout Container -->
  <main class="calculator-app">
    <div class="app-container">
      
      <!-- Calculator Main Block -->
      <div class="calculator-wrapper">
        
        <!-- Header Actions (Glass Header) -->
        <div class="calculator-header">
          <div class="header-dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <div class="header-title">
            <span>inCode<span class="cyan-text">Calc</span></span>
          </div>
          <button class="history-toggle-btn" id="historyToggleBtn" aria-label="Toggle History" title="View History">
            <i class="fa-solid fa-history"></i>
          </button>
        </div>

        <!-- Calculator Display -->
        <div class="calculator-display">
          <div class="formula-line" id="formulaLine"></div>
          <div class="result-line" id="resultLine">0</div>
        </div>

        <!-- Keypad Grid -->
        <div class="calculator-keypad">
          <!-- Row 1: Actions -->
          <button class="key action-key" data-action="all-clear">AC</button>
          <button class="key action-key" data-action="delete" aria-label="Delete last digit"><i class="fa-solid fa-backspace"></i></button>
          <button class="key action-key" data-value="%">%</button>
          <button class="key operator-key" data-value="/">&divide;</button>

          <!-- Row 2: Numbers & Multiply -->
          <button class="key number-key" data-value="7">7</button>
          <button class="key number-key" data-value="8">8</button>
          <button class="key number-key" data-value="9">9</button>
          <button class="key operator-key" data-value="*">&times;</button>

          <!-- Row 3: Numbers & Subtract -->
          <button class="key number-key" data-value="4">4</button>
          <button class="key number-key" data-value="5">5</button>
          <button class="key number-key" data-value="6">6</button>
          <button class="key operator-key" data-value="-">&minus;</button>

          <!-- Row 4: Numbers & Add -->
          <button class="key number-key" data-value="1">1</button>
          <button class="key number-key" data-value="2">2</button>
          <button class="key number-key" data-value="3">3</button>
          <button class="key operator-key" data-value="+">&plus;</button>

          <!-- Row 5: Negate, 0, Decimal, Equals -->
          <button class="key action-key" data-action="negate">&plusmn;</button>
          <button class="key number-key" data-value="0">0</button>
          <button class="key number-key" data-value=".">.</button>
          <button class="key equals-key" data-action="calculate">&equals;</button>
        </div>
      </div>

      <!-- History Panel (Side Drawer Widget) -->
      <aside class="history-panel" id="historyPanel">
        <div class="history-panel-header">
          <h3>Calculation History</h3>
          <button class="clear-history-btn" id="clearHistoryBtn" title="Clear History">Clear</button>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-history-msg">No recent calculations</div>
        </div>
      </aside>

    </div>

    <!-- Quick Keyboard Guide Indicator -->
    <div class="keyboard-guide">
      <p><i class="fa-solid fa-keyboard"></i> Tip: Supports full keyboard input (numbers, operator keys, Esc for clear, Enter for result)</p>
    </div>
  </main>

  <!-- Custom Script -->
  <script src="app.js"></script>
</body>
</html>
